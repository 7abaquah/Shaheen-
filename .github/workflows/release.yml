# إصدار شامل عند وسم v*: حزمة PWA و Android و iOS، تُرفق كلها بالإصدار في خطوة واحدة (بلا تسابق)
# الأسرار اختيارية: بدونها تُبنى نسخ غير موقّعة صالحة للاختبار فقط.
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   iOS:     IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROFILE_BASE64, IOS_TEAM_ID
# المتغيرات العامة (Settings → Variables): SHN_API_BASE, SHN_TURNSTILE_SITE_KEY, SHN_WEBSITE_URL, SHN_APP_URL
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
env:
  SHN_API_BASE: ${{ vars.SHN_API_BASE }}
  SHN_TURNSTILE_SITE_KEY: ${{ vars.SHN_TURNSTILE_SITE_KEY }}
  SHN_WEBSITE_URL: ${{ vars.SHN_WEBSITE_URL }}
  SHN_APP_URL: ${{ vars.SHN_APP_URL }}
  SHN_PRESALE_ENABLED: ${{ vars.SHN_PRESALE_ENABLED }}
defaults:
  run:
    shell: bash   # يفعّل pipefail فلا يخفي tail فشل xcodebuild
jobs:
  pwa:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: mkdir -p out && cd dist/pwa && zip -qr ../../out/shaheen-pwa.zip .
      - uses: actions/upload-artifact@v4
        with: { name: shaheen-pwa, path: app/out/ }

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Native project
        run: |
          [ -d android ] || npx cap add android
          npm run mobile:assets -- --android
          npx cap sync android
      - name: Gradle build
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - name: Sign release
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/shaheen-debug.apk
          if [ -z "$KS_B64" ]; then
            echo "No signing secrets: shipping debug APK only."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > release.jks
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out out/shaheen-release.apk aligned.apk
          "$BT/apksigner" verify out/shaheen-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/shaheen-release.aab
          jarsigner -keystore release.jks -storepass:env KS_PASS -keypass:env KEY_PASS out/shaheen-release.aab "$KEY_ALIAS"
          rm -f release.jks aligned.apk
      - uses: actions/upload-artifact@v4
        with: { name: shaheen-android, path: app/out/ }

  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: app, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run build
      - name: Native project
        run: |
          [ -d ios ] || npx cap add ios
          npm run mobile:assets -- --ios
          npx cap sync ios
      - name: Locate Xcode project
        id: proj
        run: |
          if [ -d ios/App/App.xcworkspace ]; then echo "flag=-workspace ios/App/App.xcworkspace" >> "$GITHUB_OUTPUT"; else echo "flag=-project ios/App/App.xcodeproj" >> "$GITHUB_OUTPUT"; fi
      - name: Simulator build (compile check)
        run: xcodebuild ${{ steps.proj.outputs.flag }} -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Device archive
        env:
          P12_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          mkdir -p out
          if [ -z "$P12_B64" ]; then
            xcodebuild ${{ steps.proj.outputs.flag }} -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO archive | tail -20
            mkdir -p Payload && cp -R build/App.xcarchive/Products/Applications/App.app Payload/
            zip -qr out/shaheen-ios-unsigned.ipa Payload
            echo "Unsigned IPA: must be signed with an Apple Developer certificate before installing."
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain-db"; KC_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12_B64" | base64 -d > cert.p12
          security import cert.p12 -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC"
          security list-keychain -d user -s "$KC"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 -d > profile.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          xcodebuild ${{ steps.proj.outputs.flag }} -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$NAME" archive | tail -20
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>sa.shaheen.app</key><string>$NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/export | tail -20
          cp build/export/*.ipa out/shaheen-ios.ipa
          rm -f cert.p12 profile.mobileprovision
          security delete-keychain "$KC"
      - uses: actions/upload-artifact@v4
        with: { name: shaheen-ios, path: app/out/ }

  release:
    needs: [pwa, android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
