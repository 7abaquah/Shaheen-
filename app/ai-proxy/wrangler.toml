name = "shaheen-ai-proxy"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGINS = "https://YOUR-DOMAIN"
MODEL = "claude-sonnet-5-5"
MAX_TOKENS = "1200"
DAILY_REQUEST_CAP = "500"

# إلزامي: 20 طلبًا في الدقيقة لكل IP (أو لكل /64 في IPv6)
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# إلزامي: عدّاد الاستهلاك اليومي. أنشئه: npx wrangler kv namespace create USAGE ثم ضع المعرّف هنا
[[kv_namespaces]]
binding = "USAGE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
